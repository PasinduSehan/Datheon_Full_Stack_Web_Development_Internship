<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Dynamic Task Manager (CRUD)</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div>
        <h1><i class="fas fa-check-double"></i> TaskFlow</h1>
        <p>Dynamic Task Manager & Productivity Tracker</p>
      </div>
      <div class="stats-pill">
        <span id="completedCount">0</span> / <span id="totalCount">0</span> Done
      </div>
    </header>

    <!-- Add / Edit Task Form -->
    <form id="taskForm" class="task-form">
      <input type="hidden" id="editTaskId" />
      <div class="form-row">
        <input
          type="text"
          id="taskTitle"
          placeholder="What needs to be done?"
          required
        />
      </div>
      <div class="form-row controls-row">
        <select id="taskCategory">
          <option value="Work">💼 Work</option>
          <option value="Study">📚 Study</option>
          <option value="Personal">🏠 Personal</option>
        </select>

        <input type="date" id="taskDueDate" required />

        <button type="submit" id="submitBtn" class="btn-primary">
          <i class="fas fa-plus"></i> Add Task
        </button>
        <button type="button" id="cancelEditBtn" class="btn-secondary hidden">
          Cancel
        </button>
      </div>
    </form>

    <!-- Search & Filters -->
    <div class="filter-bar">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search tasks..." />
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <select id="categoryFilter" class="category-select">
        <option value="all">All Categories</option>
        <option value="Work">Work</option>
        <option value="Study">Study</option>
        <option value="Personal">Personal</option>
      </select>
    </div>

    <!-- Task List Container -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state hidden">
      <i class="fas fa-clipboard-list"></i>
      <p>No tasks found. Add a new task above to get started!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
